<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Danish</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(#8ec5ff, #e0f2ff);
  overflow: hidden;
}

.slide {
  display: none;
  height: 100vh;
  text-align: center;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  padding: 20px;
}

.active {
  display: flex;
}

h1 {
  color: #0066cc;
  font-size: 35px;
}

p {
  font-size: 20px;
  color: #333;
}

button {
  margin-top: 30px;
  padding: 12px 25px;
  border: none;
  border-radius: 20px;
  background: #0066cc;
  color: white;
  font-size: 16px;
}

.heart {
  font-size: 50px;
}
</style>

</head>

<body>

<div class="slide active">
  ... slide pertama ...
</div>


<div class="slide">
  <div class="heart">🎂</div>
  <h1>For You, Danish</h1>
  <p>
    Terima kasih sudah hadir dan menjadi seseorang yang spesial.
    Semoga di umur 16 ini kamu selalu bahagia, sehat, dan semua impianmu tercapai ✨
  </p>

  <button onclick="nextSlide()">Next</button>
</div>


<script>
let slide = 0;

function nextSlide(){
  let slides = document.querySelectorAll(".slide");

  slides[slide].classList.remove("active");

  slide++;

  slides[slide].classList.add("active");
}
</script>

</body>
</html>
